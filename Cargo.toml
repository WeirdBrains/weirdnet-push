[package]
name = "weirdnet-push"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Weird Brains LLC"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-push"
description = "Weirdnet push wake-up: fixed-size wake payloads sealed to the device, opaque wake handles with rotation and revocation, a client, and a self-hostable server delivering through APNs, FCM and Weirdnet relays."
readme = "README.md"
keywords = ["push", "apns", "fcm", "wake", "weirdnet"]
categories = ["network-programming", "cryptography"]
include = ["src/**", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[features]
default = ["client", "relay-wake"]
# The relay wake path's wire protocol (devices, senders and relays).
relay-wake = ["dep:futures-util", "futures-util/io"]
# The HTTP client for devices and senders.
client = ["dep:reqwest"]
# The push server (library and the `weirdnet-push` binary).
server = ["client", "dep:tokio", "dep:tracing", "dep:axum", "dep:jsonwebtoken", "dep:toml", "dep:clap", "dep:tracing-subscriber", "dep:futures-util", "tokio/signal"]

[[bin]]
name = "weirdnet-push"
required-features = ["server"]

[dependencies]
weirdnet-keys = { version = "0.1.0", default-features = false }
chacha20poly1305 = "0.10"
zeroize = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"], optional = true }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "json"], optional = true }
jsonwebtoken = { version = "12", default-features = false, features = ["use_pem", "rust_crypto"], optional = true }
toml = { version = "0.9", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
hex = "0.4"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
rsa = { version = "0.9", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[package.metadata.docs.rs]
all-features = true

# RSA key generation in tests is slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
